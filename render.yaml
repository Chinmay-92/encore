# Render Blueprint (optional). Set QLOO_API_KEY and ANTHROPIC_API_KEY in the dashboard.
services:
  - type: web
    name: encore
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
