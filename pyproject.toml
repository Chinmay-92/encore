[project]
name = "encore"
version = "0.1.0"
description = "Encore: a taste-grounded agent that plans personalised reminiscence activities for people living with dementia, powered by Qloo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anthropic>=0.70",
    "pydantic>=2.8",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
